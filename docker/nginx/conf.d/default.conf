# WebSocket 升级所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # 使用 Docker 内嵌 DNS 解析上游服务名，避免容器重建后 IP 失效导致 502
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---------- 后端 API（REST / SSE / WebSocket）----------
    # 浏览器统一通过 /api 前缀访问后端，这里剥离前缀后转发到 api:3000
    location /api/ {
        set $api_target api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_target;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接：关闭缓冲并延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 前端 Next.js ----------
    location / {
        set $web_target web:3001;
        proxy_pass http://$web_target;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
